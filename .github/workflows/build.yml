name: build

# Until v1.0 only macOS is built, to keep CI fast. Two macOS jobs run side by
# side: `test` (debug build, unit and integration tests on the fixtures) and
# `build` (release binary, probe/scan/verify on the fixtures, the artifact).
# Pull requests build arm64 only; main, tags and manual runs also build x86_64
# (the old Intel MacBook), the universal binary and run it under Rosetta 2.
# A pull request that changes only docs (docs/**, *.md) skips both: skipped
# jobs count as passed for required checks. Linux runs only when started by
# hand (Actions → build → Run workflow); it is the one job that tests the real
# recognizer.
#
# Compiled dependencies are cached per job by Swatinem/rust-cache; only runs
# on main save the cache, pull requests start from main's. The static C
# libraries (libheif, libde265) are cached separately in .deps, outside
# core/target so that the Rust cache's clean-up never touches them.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still going
# (on main too: the cache is saved again by the next run that finishes). A
# tag's run is the release and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEPS_DIR: ${{ github.workspace }}/.deps
  CARGO_INCREMENTAL: 0

jobs:
  # Does this pull request touch anything but docs? Push and manual runs
  # always build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('scripts/build-deps.sh') }}

      # Runs each test in its own process, all test files at once (cargo test
      # runs the files one after the other).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Tools for test fixtures
        run: brew install ffmpeg libheif exiftool

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Tests
        run: SHOEBOX_FIXTURES="$RUNNER_TEMP/fixtures" scripts/build.sh aarch64-apple-darwin test

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Apple Silicon runner; the x86_64 binary is tested under Rosetta 2.
    runs-on: macos-latest
    env:
      FULL: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Tools for test fixtures
        run: brew install ffmpeg libheif exiftool

      - name: Build x86_64 (macOS 10.13+)
        if: env.FULL == 'true'
        run: scripts/build.sh x86_64-apple-darwin

      - name: Build arm64 (macOS 11+)
        run: scripts/build.sh aarch64-apple-darwin

      - name: Universal binary
        if: env.FULL == 'true'
        run: |
          mkdir -p dist
          lipo -create -output dist/shoebox-macos \
            core/target/x86_64-apple-darwin/release/shoebox \
            core/target/aarch64-apple-darwin/release/shoebox
          lipo -info dist/shoebox-macos
          otool -L dist/shoebox-macos
          vtool -show-build -arch x86_64 dist/shoebox-macos | grep -E "minos|version"

      - name: arm64 binary only (pull requests)
        if: env.FULL != 'true'
        run: |
          mkdir -p dist
          cp core/target/aarch64-apple-darwin/release/shoebox dist/shoebox-macos

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Probe, scan and verify fixtures (arm64, and x86_64 via Rosetta)
        run: |
          archs=arm64
          if [ "$FULL" = true ]; then
            softwareupdate --install-rosetta --agree-to-license || true
            archs="arm64 x86_64"
          fi
          for arch in $archs; do
            arch -$arch dist/shoebox-macos probe "$RUNNER_TEMP/fixtures" --report dist/probe-$arch.json
            rm -rf "$RUNNER_TEMP/lib-$arch" && cp -R "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos scan "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos scan "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos verify "$RUNNER_TEMP/lib-$arch"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: shoebox-macos
          path: dist/

  # Off until v1.0 unless started by hand; then also add it back to the
  # release job below.
  linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ffmpeg libheif-examples libheif-plugin-x265 libimage-exiftool-perl

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: false

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build
        run: scripts/build.sh x86_64-unknown-linux-gnu

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      # The real recognizer (OpenCV, models) for its own tests and for the
      # Rust test that runs it under the guard; a photo of a face from the
      # OpenCV samples checks detection and embeddings.
      - name: Recognizer
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet opencv-python-headless numpy
          recognizer/fetch-models.sh
          curl -fsSL -o "$RUNNER_TEMP/face.jpg" https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg
          # A dog (Darknet's sample) checks the pets task.
          curl -fsSL -o "$RUNNER_TEMP/dog.jpg" https://raw.githubusercontent.com/pjreddie/darknet/master/data/dog.jpg
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          SHOEBOX_TEST_FACE="$RUNNER_TEMP/face.jpg" SHOEBOX_TEST_PET="$RUNNER_TEMP/dog.jpg" \
            "$RUNNER_TEMP/venv/bin/python" -m unittest -v recognizer/test_recognizer.py

      - name: Tests
        run: |
          SHOEBOX_FIXTURES="$RUNNER_TEMP/fixtures" SHOEBOX_RECOGNIZER="$PWD/recognizer/recognizer.py" \
            SHOEBOX_TEST_FACE="$RUNNER_TEMP/face.jpg" scripts/build.sh x86_64-unknown-linux-gnu test

      - name: Probe, scan and verify fixtures
        run: |
          mkdir -p dist
          cp core/target/x86_64-unknown-linux-gnu/release/shoebox dist/shoebox-linux
          dist/shoebox-linux probe "$RUNNER_TEMP/fixtures" --report dist/probe-linux.json
          cp -R "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/lib"
          dist/shoebox-linux scan "$RUNNER_TEMP/lib"
          dist/shoebox-linux scan "$RUNNER_TEMP/lib"
          dist/shoebox-linux verify "$RUNNER_TEMP/lib"
          dist/shoebox-linux recognize "$RUNNER_TEMP/lib" --recognizer recognizer/recognizer.py --pets
          dist/shoebox-linux verify "$RUNNER_TEMP/lib"

      - uses: actions/upload-artifact@v7
        with:
          name: shoebox-linux
          path: dist/

  # The guide (HTML, its plain-text copies and the screenshots) is made from
  # this commit by guide.yml and goes into the archive.
  guide:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/guide.yml

  # Push a tag like `v0.1.0-phase1` to publish the binaries as a GitHub
  # release. Workflow artifacts need a GitHub login, expire, and lose the
  # executable bit; release assets don't. The recognizer installer goes
  # along, so the drive can be set up without a clone of the repo, and so does
  # the guide (English and German, HTML and plain text, with its screenshots)
  # in the folder `guide` of the archive.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, guide]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: shoebox-macos
          path: artifacts/shoebox-macos

      - uses: actions/download-artifact@v8
        with:
          name: guide
          path: artifacts/guide

      - name: Package
        run: |
          mkdir -p release
          # the notices for the libraries in the binary must match Cargo.lock and the vendored web libraries
          python3 scripts/third-party-licenses.py --check
          for os in macos; do
            pkg="$RUNNER_TEMP/shoebox-$os"
            mkdir -p "$pkg/recognizer"
            # inside its own folder per system the program is just "shoebox"
            cp artifacts/shoebox-$os/shoebox-$os "$pkg/shoebox"
            chmod +x "$pkg/shoebox"
            cp LICENSE.txt THIRD-PARTY-LICENSES.txt "$pkg/"
            cp "scripts/launchers/Start shoebox.command" "$pkg/"
            chmod +x "$pkg/Start shoebox.command"
            cp recognizer/README.md recognizer/install.sh recognizer/fetch-models.sh recognizer/recognizer.py "$pkg/recognizer/"
            cp -R artifacts/guide "$pkg/guide"
            chmod +x "$pkg/recognizer/install.sh" "$pkg/recognizer/fetch-models.sh"
            tar -C "$RUNNER_TEMP" -czf release/shoebox-$os.tar.gz shoebox-$os
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --prerelease --generate-notes
