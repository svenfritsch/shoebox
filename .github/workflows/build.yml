name: build

# Until v1.0 only macOS is built, to keep CI fast. Two macOS jobs run side by
# side: `test` (debug build, unit and integration tests on the fixtures) and
# `build` (release binary, probe/scan/verify on the fixtures, the artifact).
# Pull requests build arm64 only; main, tags and manual runs also build x86_64
# (the old Intel MacBook), the universal binary and run it under Rosetta 2.
# A pull request that changes only docs (docs/**, *.md) skips both: skipped
# jobs count as passed for required checks. Linux runs only when started by
# hand (Actions → build → Run workflow); it is the one job that tests the real
# recognizer.
#
# Compiled dependencies are cached per job by Swatinem/rust-cache; only runs
# on main save the cache, pull requests start from main's. The C libraries
# (libheif, libde265) are cached separately in .deps, outside core/target so
# that the Rust cache's clean-up never touches them. They ship as separate
# files next to the program (LGPL), so every dist/ folder carries them.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still going
# (on main too: the cache is saved again by the next run that finishes). A
# tag's run is the release and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEPS_DIR: ${{ github.workspace }}/.deps
  CARGO_INCREMENTAL: 0

jobs:
  # Does this pull request touch anything but docs? Push and manual runs
  # always build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('scripts/build-deps.sh') }}

      # Runs each test in its own process, all test files at once (cargo test
      # runs the files one after the other).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Tools for test fixtures
        run: brew install ffmpeg libheif exiftool

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Tests
        run: SHOEBOX_FIXTURES="$RUNNER_TEMP/fixtures" scripts/build.sh aarch64-apple-darwin test

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Apple Silicon runner; the x86_64 binary is tested under Rosetta 2.
    runs-on: macos-latest
    env:
      FULL: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Tools for test fixtures
        run: brew install ffmpeg libheif exiftool

      - name: Build x86_64 (macOS 10.13+)
        if: env.FULL == 'true'
        run: scripts/build.sh x86_64-apple-darwin

      - name: Build arm64 (macOS 11+)
        run: scripts/build.sh aarch64-apple-darwin

      - name: Universal binary
        if: env.FULL == 'true'
        run: |
          mkdir -p dist
          for f in shoebox libheif.1.dylib libde265.0.dylib; do
            out=dist/$f; [ $f = shoebox ] && out=dist/shoebox-macos
            lipo -create -output "$out" \
              core/target/x86_64-apple-darwin/release/$f \
              core/target/aarch64-apple-darwin/release/$f
            lipo -info "$out"
          done
          # The x86_64 linker does not sign (the arm64 one does), and lipo
          # keeps each half as it is: sign the program ad hoc, as
          # build-deps.sh does the libraries.
          codesign --force --sign - dist/shoebox-macos
          vtool -show-build -arch x86_64 dist/shoebox-macos | grep -E "minos|version"
          vtool -show-build -arch x86_64 dist/libheif.1.dylib | grep -E "minos|version"

      - name: arm64 binary only (pull requests)
        if: env.FULL != 'true'
        run: |
          mkdir -p dist
          cp core/target/aarch64-apple-darwin/release/shoebox dist/shoebox-macos
          cp core/target/aarch64-apple-darwin/release/libheif.1.dylib \
            core/target/aarch64-apple-darwin/release/libde265.0.dylib dist/

      # The program loads libheif from its own folder only, carries no build
      # path, and everything is signed (Apple Silicon loads nothing unsigned).
      - name: Check the libraries next to the program
        run: |
          otool -L dist/shoebox-macos dist/libheif.1.dylib
          otool -L dist/shoebox-macos | grep -q '@rpath/libheif.1.dylib'
          otool -L dist/libheif.1.dylib | grep -q '@rpath/libde265.0.dylib'
          rpaths=$(otool -l dist/shoebox-macos | awk '/LC_RPATH/ {getline; getline; print $2}' | sort -u)
          echo "rpaths: $rpaths"
          [ "$rpaths" = "@executable_path" ]
          if otool -L dist/shoebox-macos dist/*.dylib | grep -E '/(opt|usr/local)/'; then
            echo "links a library from Homebrew" >&2; exit 1
          fi
          codesign --verify --verbose dist/shoebox-macos dist/libheif.1.dylib dist/libde265.0.dylib

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Probe, scan and verify fixtures (arm64, and x86_64 via Rosetta)
        run: |
          archs=arm64
          if [ "$FULL" = true ]; then
            softwareupdate --install-rosetta --agree-to-license || true
            archs="arm64 x86_64"
          fi
          for arch in $archs; do
            arch -$arch dist/shoebox-macos probe "$RUNNER_TEMP/fixtures" --report dist/probe-$arch.json
            rm -rf "$RUNNER_TEMP/lib-$arch" && cp -R "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos scan "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos scan "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos verify "$RUNNER_TEMP/lib-$arch"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: shoebox-macos
          path: dist/

  # Off until v1.0 unless started by hand; then also add it back to the
  # release job below.
  linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ffmpeg libheif-examples libheif-plugin-x265 libimage-exiftool-perl

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: false

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build
        run: scripts/build.sh x86_64-unknown-linux-gnu

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      # The real recognizer (OpenCV, models) for its own tests and for the
      # Rust test that runs it under the guard; a photo of a face from the
      # OpenCV samples checks detection and embeddings.
      - name: Recognizer
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet opencv-python-headless numpy
          recognizer/fetch-models.sh
          curl -fsSL -o "$RUNNER_TEMP/face.jpg" https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg
          # A dog (Darknet's sample) checks the pets task.
          curl -fsSL -o "$RUNNER_TEMP/dog.jpg" https://raw.githubusercontent.com/pjreddie/darknet/master/data/dog.jpg
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          SHOEBOX_TEST_FACE="$RUNNER_TEMP/face.jpg" SHOEBOX_TEST_PET="$RUNNER_TEMP/dog.jpg" \
            "$RUNNER_TEMP/venv/bin/python" -m unittest -v recognizer/test_recognizer.py

      - name: Tests
        run: |
          SHOEBOX_FIXTURES="$RUNNER_TEMP/fixtures" SHOEBOX_RECOGNIZER="$PWD/recognizer/recognizer.py" \
            SHOEBOX_TEST_FACE="$RUNNER_TEMP/face.jpg" scripts/build.sh x86_64-unknown-linux-gnu test

      - name: Probe, scan and verify fixtures
        run: |
          mkdir -p dist
          cp core/target/x86_64-unknown-linux-gnu/release/shoebox dist/shoebox-linux
          cp core/target/x86_64-unknown-linux-gnu/release/libheif.so.1 \
            core/target/x86_64-unknown-linux-gnu/release/libde265.so.0 dist/
          readelf -d dist/shoebox-linux dist/libheif.so.1 | grep -E 'NEEDED|RUNPATH|RPATH'
          dist/shoebox-linux probe "$RUNNER_TEMP/fixtures" --report dist/probe-linux.json
          cp -R "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/lib"
          dist/shoebox-linux scan "$RUNNER_TEMP/lib"
          dist/shoebox-linux scan "$RUNNER_TEMP/lib"
          dist/shoebox-linux verify "$RUNNER_TEMP/lib"
          dist/shoebox-linux recognize "$RUNNER_TEMP/lib" --recognizer recognizer/recognizer.py --pets
          dist/shoebox-linux verify "$RUNNER_TEMP/lib"

      - uses: actions/upload-artifact@v7
        with:
          name: shoebox-linux
          path: dist/

  # Windows (MSVC): started by hand, like Linux, until it is part of the
  # release ("Decoders per build", step 4, in docs/plan.md). libheif and
  # libde265 are DLLs next to shoebox.exe; the C runtime is linked in, so
  # nothing needs to be installed on the PC. The artifact's shoebox-windows/
  # is laid out like the macOS release (Start shoebox.bat on top, program/ with
  # shoebox.exe, the DLLs and recognizer/ with install.ps1), so it can be tried
  # as is (no licences, sources or guide yet: phase 17).
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: false

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-windows-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Tests
        run: scripts/build.sh x86_64-pc-windows-msvc test

      - name: Build
        run: scripts/build.sh x86_64-pc-windows-msvc

      # A JPEG and a real HEIC (pillow-heif can write one) in folders with a
      # space and an umlaut, read by the program from a folder of its own.
      - name: Probe, scan and verify
        run: |
          mkdir -p "dist/shoebox-windows/program"
          r=core/target/x86_64-pc-windows-msvc/release
          cp "$r/shoebox.exe" "$r/heif.dll" "$r/libde265.dll" "dist/shoebox-windows/program/"
          python -m pip install --quiet pillow pillow-heif
          python - "$RUNNER_TEMP/lib" <<'PY'
          import sys, pathlib
          from PIL import Image
          import pillow_heif
          pillow_heif.register_heif_opener()
          root = pathlib.Path(sys.argv[1]) / "Ferien Grüße"
          root.mkdir(parents=True, exist_ok=True)
          img = Image.radial_gradient("L").resize((1200, 800)).convert("RGB")
          img.save(root / "IMG_0001.JPG", quality=90)
          img.save(root / "IMG_0002.HEIC", quality=60)
          PY
          dist/shoebox-windows/program/shoebox.exe probe "$RUNNER_TEMP/lib" --report dist/probe-windows.json
          # Both pictures got a preview (the HEIC through heif.dll).
          python -c "import json,sys; r=json.load(open('dist/probe-windows.json',encoding='utf-8')); bad=[f for f in r['files'] if not f['preview']]; print(r['filesystem'], len(r['files']), 'files'); sys.exit(1 if bad or len(r['files'])!=2 else 0)"
          dist/shoebox-windows/program/shoebox.exe scan "$RUNNER_TEMP/lib"
          dist/shoebox-windows/program/shoebox.exe scan "$RUNNER_TEMP/lib"
          dist/shoebox-windows/program/shoebox.exe verify "$RUNNER_TEMP/lib"

      # The folder as a person gets it: the double-click starter on top, the
      # recognizer with the Windows installer next to shoebox.exe in program/
      # (the Control Panel installs add-ons only when it finds
      # recognizer\install.ps1 there).
      - name: Package
        run: |
          pkg=dist/shoebox-windows
          cp "scripts/launchers/Start shoebox.bat" "$pkg/"
          mkdir -p "$pkg/program/recognizer"
          cp recognizer/README.md recognizer/install.ps1 recognizer/fetch-models.ps1 recognizer/recognizer.py "$pkg/program/recognizer/"
          ls -R "$pkg"

      - uses: actions/upload-artifact@v7
        with:
          name: shoebox-windows
          path: dist/

  # The guide (HTML, its plain-text copies and the screenshots) is made from
  # this commit by guide.yml and goes into the archive.
  guide:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/guide.yml

  # Push a tag like `v0.1.0-phase1` to publish the binaries as a GitHub
  # release. Workflow artifacts need a GitHub login, expire, and lose the
  # executable bit; release assets don't. The recognizer installer goes
  # along, so the drive can be set up without a clone of the repo, and so does
  # the guide (English and German, HTML and plain text, with its screenshots).
  #
  # The archive holds one folder with three things on top, so a person sees
  # what to double-click and nothing else (docs/plan.md, "The release folder"):
  #   shoebox-macos/
  #     Start shoebox.command
  #     guide/
  #     program/   shoebox, libheif/libde265, recognizer/, sources/, licences
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, guide]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: shoebox-macos
          path: artifacts/shoebox-macos

      - uses: actions/download-artifact@v8
        with:
          name: guide
          path: artifacts/guide

      - name: Package
        run: |
          mkdir -p release
          # the notices for the libraries in the binary must match Cargo.lock and the vendored web libraries
          python3 scripts/third-party-licenses.py --check
          for os in macos; do
            top="$RUNNER_TEMP/shoebox-$os"
            prog="$top/program"
            mkdir -p "$prog/recognizer"
            # inside its own folder per system the program is just "shoebox"
            cp artifacts/shoebox-$os/shoebox-$os "$prog/shoebox"
            chmod +x "$prog/shoebox"
            # libheif and libde265 next to it (LGPL: replaceable), with their
            # unmodified sources
            cp artifacts/shoebox-$os/libheif.1.dylib artifacts/shoebox-$os/libde265.0.dylib "$prog/"
            scripts/build-deps.sh --sources "$prog/sources"
            cp LICENSE.txt THIRD-PARTY-LICENSES.txt "$prog/"
            cp recognizer/README.md recognizer/install.sh recognizer/fetch-models.sh recognizer/recognizer.py "$prog/recognizer/"
            chmod +x "$prog/recognizer/install.sh" "$prog/recognizer/fetch-models.sh"
            cp "scripts/launchers/Start shoebox.command" "$top/"
            chmod +x "$top/Start shoebox.command"
            cp -R artifacts/guide "$top/guide"
            # nothing else on top
            [ "$(ls -A "$top" | LC_ALL=C sort | tr '\n' '|')" = "Start shoebox.command|guide|program|" ]
            tar -C "$RUNNER_TEMP" -czf release/shoebox-$os.tar.gz shoebox-$os
          done
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --prerelease --generate-notes
