name: build

# Until v1.0 only macOS is built, to keep CI fast. Two macOS jobs run side by
# side: `test` (debug build, unit and integration tests on the fixtures) and
# `build` (release binary, probe/scan/verify on the fixtures, the artifact).
# Pull requests build arm64 only; main, tags and manual runs also build x86_64
# (the old Intel MacBook), the universal binary and run it under Rosetta 2.
# A pull request that changes only docs (docs/**, *.md) skips both: skipped
# jobs count as passed for required checks. Windows and Linux are built only
# by hand, each on its own, in release-by-hand.yml (which can add them to a
# release); the Linux run is the one that tests the real recognizer.
#
# Compiled dependencies are cached per job by Swatinem/rust-cache; only runs
# on main save the cache, pull requests start from main's. The C libraries
# (libheif, libde265) are cached separately in .deps, outside core/target so
# that the Rust cache's clean-up never touches them. They ship as separate
# files next to the program (LGPL), so every dist/ folder carries them.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still going
# (on main too: the cache is saved again by the next run that finishes). A
# tag's run is the release and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEPS_DIR: ${{ github.workspace }}/.deps
  CARGO_INCREMENTAL: 0

jobs:
  # Does this pull request touch anything but docs? Push and manual runs
  # always build.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('scripts/build-deps.sh') }}

      # Runs each test in its own process, all test files at once (cargo test
      # runs the files one after the other).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Tools for test fixtures
        run: brew install ffmpeg libheif exiftool

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Tests
        run: SHOEBOX_FIXTURES="$RUNNER_TEMP/fixtures" scripts/build.sh aarch64-apple-darwin test

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Apple Silicon runner; the x86_64 binary is tested under Rosetta 2.
    runs-on: macos-latest
    env:
      FULL: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache static deps
        uses: actions/cache@v6
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Tools for test fixtures
        run: brew install ffmpeg libheif exiftool

      - name: Build x86_64 (macOS 10.13+)
        if: env.FULL == 'true'
        run: scripts/build.sh x86_64-apple-darwin

      - name: Build arm64 (macOS 11+)
        run: scripts/build.sh aarch64-apple-darwin

      - name: Universal binary
        if: env.FULL == 'true'
        run: |
          mkdir -p dist
          for f in shoebox libheif.1.dylib libde265.0.dylib; do
            out=dist/$f; [ $f = shoebox ] && out=dist/shoebox-macos
            lipo -create -output "$out" \
              core/target/x86_64-apple-darwin/release/$f \
              core/target/aarch64-apple-darwin/release/$f
            lipo -info "$out"
          done
          # The x86_64 linker does not sign (the arm64 one does), and lipo
          # keeps each half as it is: sign the program ad hoc, as
          # build-deps.sh does the libraries.
          codesign --force --sign - dist/shoebox-macos
          vtool -show-build -arch x86_64 dist/shoebox-macos | grep -E "minos|version"
          vtool -show-build -arch x86_64 dist/libheif.1.dylib | grep -E "minos|version"

      - name: arm64 binary only (pull requests)
        if: env.FULL != 'true'
        run: |
          mkdir -p dist
          cp core/target/aarch64-apple-darwin/release/shoebox dist/shoebox-macos
          cp core/target/aarch64-apple-darwin/release/libheif.1.dylib \
            core/target/aarch64-apple-darwin/release/libde265.0.dylib dist/

      # The program loads libheif from its own folder only, carries no build
      # path, and everything is signed (Apple Silicon loads nothing unsigned).
      - name: Check the libraries next to the program
        run: |
          otool -L dist/shoebox-macos dist/libheif.1.dylib
          otool -L dist/shoebox-macos | grep -q '@rpath/libheif.1.dylib'
          otool -L dist/libheif.1.dylib | grep -q '@rpath/libde265.0.dylib'
          rpaths=$(otool -l dist/shoebox-macos | awk '/LC_RPATH/ {getline; getline; print $2}' | sort -u)
          echo "rpaths: $rpaths"
          [ "$rpaths" = "@executable_path" ]
          if otool -L dist/shoebox-macos dist/*.dylib | grep -E '/(opt|usr/local)/'; then
            echo "links a library from Homebrew" >&2; exit 1
          fi
          codesign --verify --verbose dist/shoebox-macos dist/libheif.1.dylib dist/libde265.0.dylib

      - name: Fixtures
        run: scripts/make-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Probe, scan and verify fixtures (arm64, and x86_64 via Rosetta)
        run: |
          archs=arm64
          if [ "$FULL" = true ]; then
            softwareupdate --install-rosetta --agree-to-license || true
            archs="arm64 x86_64"
          fi
          for arch in $archs; do
            arch -$arch dist/shoebox-macos probe "$RUNNER_TEMP/fixtures" --report "$RUNNER_TEMP/probe-$arch.json"
            rm -rf "$RUNNER_TEMP/lib-$arch" && cp -R "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos scan "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos scan "$RUNNER_TEMP/lib-$arch"
            arch -$arch dist/shoebox-macos verify "$RUNNER_TEMP/lib-$arch"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: shoebox-macos
          path: dist/

  # The guide (HTML, its plain-text copies and the screenshots) is made from
  # this commit by guide.yml and goes into the archive.
  guide:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/guide.yml

  # Push a tag like `v0.1.0-phase1` to publish the binaries as a GitHub
  # release. Workflow artifacts need a GitHub login, expire, and lose the
  # executable bit; release assets don't. The recognizer installer goes
  # along, so the drive can be set up without a clone of the repo, and so does
  # the guide (English and German, HTML and plain text, with its screenshots).
  #
  # The archive holds one folder with three things on top, so a person sees
  # what to double-click and nothing else (docs/plan.md, "The release folder";
  # scripts/package.sh):
  #   shoebox-macos/
  #     Start shoebox.command
  #     guide/
  #     program/   shoebox, libheif/libde265, recognizer/, sources/, licences
  # Only a pushed tag: a run started by hand on a tag would try to create a
  # release that already exists (Windows and Linux: release-by-hand.yml).
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, guide]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: shoebox-macos
          path: artifacts/shoebox-macos

      - uses: actions/download-artifact@v8
        with:
          name: guide
          path: artifacts/guide

      - name: Package
        run: |
          mkdir -p release
          # the notices for the libraries in the binary must match Cargo.lock and the vendored web libraries
          python3 scripts/third-party-licenses.py --check
          # the folder a person gets (scripts/package.sh, the same for every system)
          scripts/package.sh macos artifacts/shoebox-macos artifacts/guide "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -czf release/shoebox-macos.tar.gz shoebox-macos
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --prerelease --generate-notes
