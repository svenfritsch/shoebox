<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>shoebox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='5' width='14' height='10' rx='1' fill='%23b07d4f'/%3E%3Crect x='0' y='2' width='16' height='4' rx='1' fill='%23d9a066'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <button id="menu" class="icon" title="Folders" aria-label="Folders">☰</button>
  <h1 id="title">shoebox</h1>
  <span id="current-month" class="month"></span>
  <div class="search">
    <input id="search" type="search" placeholder="Search folders, tags, names" autocomplete="off" list="tag-list" enterkeyhint="search">
    <datalist id="tag-list"></datalist>
  </div>
  <select id="years" title="Jump to year" aria-label="Jump to year"></select>
  <button id="select" class="icon" title="Select photos" aria-label="Select photos">☑︎</button>
  <button id="import" class="icon" title="Import photos" aria-label="Import photos">⤒</button>
</header>

<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Folders">
    <div class="sidebar-head">
      <button id="all" class="link">All photos</button>
      <button id="nav-dups" class="link">Duplicates</button>
      <button id="nav-trash" class="link">Trash</button>
    </div>
    <ul id="tree" class="tree"></ul>
    <footer id="status" class="status"></footer>
  </nav>

  <main id="scroller" class="scroller">
    <div id="filters" class="filters" hidden></div>
    <div id="sizer" class="sizer"></div>
    <p id="empty" class="empty" hidden>Nothing here.</p>
    <section id="page" class="page" hidden></section>
  </main>
</div>

<div id="selbar" class="selbar" hidden>
  <span id="sel-count"></span>
  <button id="sel-move" class="btn">Move…</button>
  <button id="sel-trash" class="btn">Move to trash</button>
  <button id="sel-done" class="btn quiet">Done</button>
</div>

<div id="modal" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions" class="actions"></div>
  </div>
</div>

<div id="dropzone" class="dropzone" hidden><p>Drop photos to import them</p></div>
<div id="toast" class="toast" hidden></div>
<datalist id="folder-list"></datalist>

<div id="lightbox" class="lightbox" hidden>
  <div id="stage" class="stage"></div>
  <div class="lb-bar">
    <button id="lb-close" class="icon" title="Close (Esc)" aria-label="Close">✕</button>
    <span id="lb-title" class="lb-title"></span>
    <button id="lb-live" class="pill" hidden>LIVE ▶</button>
    <a id="lb-download" class="icon" title="Download original" aria-label="Download original">⤓</a>
    <button id="lb-info" class="icon" title="Info (i)" aria-label="Info">ⓘ</button>
  </div>
  <button id="lb-prev" class="nav prev" title="Previous (←)" aria-label="Previous">‹</button>
  <button id="lb-next" class="nav next" title="Next (→)" aria-label="Next">›</button>
  <aside id="lb-panel" class="lb-panel" hidden></aside>
</div>

<div id="login" class="login" hidden>
  <form id="login-form">
    <h2>shoebox</h2>
    <p id="login-text">Enter the PIN shown in the terminal where shoebox is running.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
    <button type="submit">Open</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
