[package]
name = "shoebox"
version = "0.0.1"
edition = "2024"
description = "Local photo library on an external drive"
publish = false

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# libheif is linked statically from scripts/build-deps.sh (decoder-only build),
# located through PKG_CONFIG_PATH; see scripts/build.sh.
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_19"] }
libc = "0.2"
nom-exif = "3.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
