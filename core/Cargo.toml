[package]
name = "shoebox"
version = "0.0.1"
edition = "2024"
description = "Local photo library on an external drive"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
http-body-util = "0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# libheif is linked statically from scripts/build-deps.sh (decoder-only build),
# located through PKG_CONFIG_PATH; see scripts/build.sh.
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_19"] }
# Scaled JPEG decoding (1/2 to 1/8 in the IDCT) makes thumbnails several
# times faster than a full decode.
jpeg-decoder = "0.3.2"
libc = "0.2"
nom-exif = "3.8.0"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "signal", "sync", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
