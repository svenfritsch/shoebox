<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../../core/launcher-web/launcher.css"><style>
.sbx{width:16px;height:16px;flex:none}
.badge.sep{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}
.chips button.lib{display:inline-flex;gap:8px;align-items:center}
.chips button.lib span{display:inline;font-size:14px;color:var(--text);margin:0}
.chips button.lib .badge{font-size:11px;color:var(--accent)}
.chips button.lib.off{border-style:dashed}.chips button.lib.off span{color:var(--muted)}
i.info{display:inline-block;width:14px;height:14px;margin-left:6px;line-height:13px;text-align:center;border:1px solid var(--muted);border-radius:50%;font-size:10px;font-style:normal;cursor:help;vertical-align:1px;color:var(--muted)}
.rootrow{display:flex;gap:8px;align-items:flex-start}.rootrow .chipbox,.rootrow>input{flex:1;min-width:0}
.rootrow>button.quiet{margin-left:0;white-space:nowrap;align-self:flex-start;height:46px}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.row-head .hint{margin:0}
.chips button.quiet{margin-left:0;padding:6px 14px;font-size:14px}
.field{margin-top:14px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;color:var(--text);font-size:15px}
.choice input{margin-top:4px}.choice.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.choice b{display:block;font-weight:600}.choice span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.note.ok{color:var(--ok)}.note.warn{border-color:var(--bad);color:var(--bad)}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.btnrow button{text-align:center}
.libs{list-style:none;margin:10px 0 0;padding:0;border:0;border-radius:0}
.libs li{padding:12px 0;border-bottom:1px solid var(--line)}.libs li:last-child{border-bottom:0}
.libs .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.libs .lname{font-weight:600}.libs .lpath{color:var(--muted);font-size:13px;word-break:break-all}
.libs .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.libs .acts button{padding:4px 12px;font-size:13px;border-radius:8px}
.libs .state{padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;white-space:nowrap;color:var(--ok)}
.libs .state.off{color:var(--muted);border-style:dashed}
.mocktag{font:12px system-ui;color:#fff;background:#8a6d00;display:inline-block;padding:2px 8px;border-radius:999px;margin:0 0 8px}
/* option A */
.tabs{margin-top:0;margin-bottom:14px}
/* option B */
.fold{border-top:1px solid var(--line);margin-top:16px}
.fold>summary{cursor:pointer;display:flex;align-items:center;gap:10px;list-style:none;padding:12px 0;font-weight:600;font-size:15px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .count{font-weight:400;color:var(--muted);font-size:14px}
.fold>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.fold[open]>summary::after{transform:rotate(45deg)}
.fold>.body{padding:0 0 4px}
.fold .field:first-child{margin-top:0}
</style></head><body><main><p class="mocktag">OPTION A · tabs · “Folders” (the default tab)</p><section class="card"><h2>2 · Where are your photos?</h2><div class="tabs" role="tablist"><button role="tab" aria-selected="true">Folders</button><button role="tab" aria-selected="false">Add a folder or server</button><button role="tab" aria-selected="false">Manage libraries (2)</button></div>
  <label>Drives or photo folders (type a path, press Enter to add it)</label>
  <div class="rootrow"><div class="chipbox"><ul>
    <li><input type="checkbox" checked><span class="name">/Volumes/Server/Photos</span><span class="badge sep"><svg class="sbx" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5" width="14" height="10" rx="1" fill="#b07d4f"/><rect x="0" y="2" width="16" height="4" rx="1" fill="#d9a066"/></svg>separate</span><button>×</button></li>
    <li><input type="checkbox" checked><span class="name">/Volumes/Extreme SSD/Photos</span><button>×</button></li>
  </ul><input placeholder="Add another folder…"></div><button class="quiet">Choose…</button></div>
  <p class="hint">Detected drives, click to start a path:</p>
  <div class="chips"><button class="has-lib">Extreme SSD</button><button>Backup 2TB</button></div>
  <div class="row-head"><p class="hint">Libraries kept next to the program <i class="info">i</i></p></div>
  <div class="chips"><button class="lib"><span>Server Photos</span><span class="badge sep"><svg class="sbx" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5" width="14" height="10" rx="1" fill="#b07d4f"/><rect x="0" y="2" width="16" height="4" rx="1" fill="#d9a066"/></svg>separate</span></button><button class="lib off"><span>Büro-Archiv</span><span class="badge sep" style="color:var(--muted)">not connected</span></button></div></section></main></body></html>
