<!doctype html><html><head><meta charset="utf-8"><title>mock</title><meta name="w" content="520"><meta name="h" content="220"><link rel="stylesheet" href="../../../core/web/app.css"><style>
html, body { margin: 0; background: var(--bg); }
body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); padding: 14px; }
.cap { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
.ic { display: inline-flex; width: 1.2em; height: 1.2em; margin-right: 8px; vertical-align: middle; }
.ic svg { width: 100%; height: 100%; }
.suggest { position: static; width: 360px; }
.chip svg { width: 1.1em; height: 1.1em; }
.chip .ficon, .chip .ic { display: inline-flex; width: 1.1em; height: 1.1em; margin: 0; }
.chip .ficon svg { width: 100%; height: 100%; }
.chip button { display: inline-flex; align-items: center; font-size: 13px; cursor: default; }
.chip .edit svg, .chip .eye svg { width: 1.05em; height: 1.05em; }
.chip .edit { color: var(--accent); }
.chip .eye { color: var(--muted); }
.chip .eye.on { color: var(--accent); }
.chip.hid { border-color: var(--accent); }
.chip.hid .lead { color: var(--accent); }
.tree { width: 300px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 6px 0; }
.tree .row { padding: 2px 10px 2px 8px; }
.tree .name { flex: 1; text-align: left; background: none; border: 0; color: var(--fg); font: inherit; padding: 4px 8px; border-radius: 6px; }
.tree .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tree .hiddenrow .name { opacity: .5; }
.tree .hiddenrow .count { opacity: .5; }
.tree .hiddenrow .name::after { content: ""; }
.tree .ico { width: 15px; height: 15px; margin-left: 2px; color: var(--muted); opacity: .85; display: inline-flex; }
.tree .ico svg { width: 100%; height: 100%; }
.tree .toggle { width: 22px; }
.tree .name.rc { background: var(--line); }
.menu { position: absolute; }
.tipx { position: absolute; z-index: 60; padding: 4px 10px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.shot { position: relative; }
.lightbox { position: relative; inset: auto; height: 100%; }
.lb-bar { position: relative; inset: auto; }
.lb-bar .icon { background: none; border: 0; color: #fff; font-size: 20px; padding: 4px 6px; }
.lb-bar .icon svg { display: block; width: 22px; height: 22px; }
.lb-bar .fav-lb.on { color: #ff4d6a; }
.lb-bar .hid-lb.on { color: var(--accent); }
.dark { background: #000; color: #eee; border-radius: 12px; overflow: hidden; }
.lb-panel { position: static; width: auto; background: rgba(24,24,24,.94); padding: 14px 18px 16px; }
.selbar { position: static; transform: none; display: inline-flex; }
.tags .own input, .lb-panel input { background: rgba(255,255,255,.1); color: #eee; border: 1px solid #666; border-radius: 99px; padding: 2px 10px; font: inherit; font-size: 13px; }
.lb-panel .note { margin: 8px 0 0; }
.shotbox { display: inline-block; position: relative; padding-bottom: 36px; }
</style></head><body><div class="shot"><div class="cap">Folder opened (normal): the eye button hides it</div><div class="row2"><span class="chip"><span class="ficon"><svg viewBox="0 0 24 24" width="1em" height="1em" style="fill:none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V7a2 2 0 0 1 2-2h3.5l2 2H17a2 2 0 0 1 2 2v1.5"/><path d="M4 18l2.6-6.4a1.5 1.5 0 0 1 1.4-.9h12.3a1 1 0 0 1 .9 1.4L19 17.6a1.5 1.5 0 0 1-1.4.9H4z"/></svg></span>08. Freunde<button class="eye"><svg viewBox="0 0 24 24" width="1em" height="1em" style="fill:none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5c2.6 3.9 5.8 5.5 9 5.5s6.4-1.6 9-5.5"/><path d="M6.3 14.4L4.6 17M12 16v3.2M17.7 14.4l1.7 2.6"/></svg></button><button class="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L9 18z"/><path d="M14.5 6.5l3 3"/></svg></button><button>✕</button></span></div><div class="cap">Folder opened (hidden): the eye is on, a click shows it again</div><div class="row2"><span class="chip"><span class="ficon"><svg viewBox="0 0 24 24" width="1em" height="1em" style="fill:none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V7a2 2 0 0 1 2-2h3.5l2 2H17a2 2 0 0 1 2 2v1.5"/><path d="M4 18l2.6-6.4a1.5 1.5 0 0 1 1.4-.9h12.3a1 1 0 0 1 .9 1.4L19 17.6a1.5 1.5 0 0 1-1.4.9H4z"/></svg></span>Privat<button class="eye on"><svg viewBox="0 0 24 24" width="1em" height="1em" style="fill:none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5c2.6 3.9 5.8 5.5 9 5.5s6.4-1.6 9-5.5"/><path d="M6.3 14.4L4.6 17M12 16v3.2M17.7 14.4l1.7 2.6"/></svg></button><button class="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L9 18z"/><path d="M14.5 6.5l3 3"/></svg></button><button>✕</button></span></div><div class="cap">The Hidden chip (next to the Favorites chip)</div><div class="row2"><span class="chip hid"><span class="ic lead" style="margin:0"><svg viewBox="0 0 24 24" width="1em" height="1em" style="fill:none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5c2.6 3.9 5.8 5.5 9 5.5s6.4-1.6 9-5.5"/><path d="M6.3 14.4L4.6 17M12 16v3.2M17.7 14.4l1.7 2.6"/></svg></span>Hidden<button>✕</button></span><span class="chip"><span class="ic" style="margin:0"><svg viewBox="0 0 24 24" width="1em" height="1em" style="fill:currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="2.2" d="M12 19.5C8 16.8 4 13.6 4 9.6 4 7.1 5.9 5.2 8.2 5.2c1.6 0 3 .9 3.8 2.3.8-1.4 2.2-2.3 3.8-2.3 2.3 0 4.2 1.9 4.2 4.4 0 4-4 7.2-8 9.9z"/></svg></span>Favorites<button>✕</button></span></div></div></body></html>
